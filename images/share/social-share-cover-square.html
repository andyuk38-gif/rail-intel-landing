<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1024px; height: 1024px; overflow: hidden; background: #012269; font-family: Outfit, sans-serif; color: #fff; }
    .gbr { display: block; width: 1024px; height: 340px; object-fit: cover; object-position: center top; }
    .lockup { position: absolute; left: 0; right: 0; top: 430px; text-align: center; }
    .lockup img { width: 128px; height: 128px; border-radius: 28px; }
    .name { margin-top: 36px; font-size: 84px; font-weight: 700; letter-spacing: -0.03em; }
    .name em { font-style: normal; color: #ff173e; }
    .line { margin-top: 24px; font-size: 34px; font-weight: 500; color: #e7eef8; }
    .rule { width: 72px; height: 4px; margin: 32px auto 0; background: #ff173e; border-radius: 2px; }
    .url { position: absolute; left: 0; right: 0; bottom: 64px; text-align: center; font-size: 20px; font-weight: 600; letter-spacing: 0.1em; color: rgba(255,255,255,0.72); }
  </style>
</head>
<body>
  <img class="gbr" src="../gbr-bg.png" alt="" />
  <div class="lockup">
    <img src="../rail-intel-icon.png" alt="" />
    <div class="name">Rail <em>Intel</em></div>
    <p class="line">Intelligent products for rail operations.</p>
    <div class="rule"></div>
  </div>
  <div class="url">RAILINTEL.CO.UK</div>
</body>
</html>
