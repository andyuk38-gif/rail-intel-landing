<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1200px; height: 627px; overflow: hidden; background: #012269; font-family: Outfit, sans-serif; color: #fff; }
    .gbr { display: block; width: 1200px; height: 248px; object-fit: cover; object-position: center top; }
    .brand { position: absolute; left: 72px; top: 300px; display: flex; align-items: center; gap: 22px; }
    .brand img { width: 88px; height: 88px; border-radius: 20px; }
    .name { font-size: 64px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
    .name em { font-style: normal; color: #ff173e; }
    .line { position: absolute; left: 72px; top: 418px; font-size: 32px; font-weight: 500; color: #e7eef8; }
    .rule { position: absolute; left: 72px; top: 508px; width: 72px; height: 4px; background: #ff173e; border-radius: 2px; }
    .url { position: absolute; right: 72px; bottom: 48px; font-size: 18px; font-weight: 600; letter-spacing: 0.1em; color: rgba(255,255,255,0.72); }
  </style>
</head>
<body>
  <img class="gbr" src="../gbr-bg.png" alt="" />
  <div class="brand">
    <img src="../rail-intel-icon.png" alt="" />
    <div class="name">Rail <em>Intel</em></div>
  </div>
  <p class="line">Intelligent products for rail operations.</p>
  <div class="rule"></div>
  <div class="url">RAILINTEL.CO.UK</div>
</body>
</html>
